# Alembic configuration file.
# This file is referenced by the `alembic` CLI command.
# The actual DATABASE_URL is read from the environment in alembic/env.py,
# so the sqlalchemy.url value below is intentionally a placeholder.

[alembic]
# Path to the alembic directory (relative to this file)
script_location = alembic

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file timestamps
timezone = UTC

# Maximum length of the slug (descriptive part of the file name)
truncate_slug_length = 40

# Placeholder — overridden in alembic/env.py using DATABASE_URL from .env
sqlalchemy.url = postgresql+psycopg://placeholder

[post_write_hooks]
# Optional: run black/ruff on generated migration files
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = check REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
